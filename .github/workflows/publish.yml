name: Publish task images

on:
  workflow_dispatch:
    inputs:
      problem_ids:
        description: "Space separated problem IDs (empty publishes every task in the dataset)"
        required: false
        default: ""
      max_tasks:
        description: "Stop after publishing this many tasks (0 publishes all selected)"
        required: false
        default: "0"
      skip_existing:
        description: "Skip a task only when both of its tags exist and resolve to the same digest"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xwysyy-studio/interactbench-task

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out publisher repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The largest task holds about 15.5 GB of cases, and building its image
      # peaks around three times that with the context, the BuildKit source
      # copy and the committed layer all resident. A stock runner does not
      # have that much free.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish each task
        env:
          PROBLEM_IDS: ${{ inputs.problem_ids }}
          MAX_TASKS: ${{ inputs.max_tasks }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          set -euo pipefail

          case "${MAX_TASKS}" in
            ''|*[!0-9]*)
              echo "max_tasks must be a non-negative integer, got '${MAX_TASKS}'" >&2
              exit 1
              ;;
          esac
          case "${SKIP_EXISTING}" in
            true|false) ;;
            *)
              echo "skip_existing must be true or false, got '${SKIP_EXISTING}'" >&2
              exit 1
              ;;
          esac

          read_lock() {
            python -c "import json,pathlib;print(json.loads(pathlib.Path('task.lock.json').read_text())$1)"
          }
          lock_digest="$(python -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path('task.lock.json').read_bytes()).hexdigest()[:8])")"
          source_revision="$(read_lock "['interactbench']['revision']")"
          dataset_revision="$(read_lock "['dataset']['revision']")"

          # Task IDs come from workflow input, so keep the shell from globbing
          # them when the list is split into words.
          set -f
          if [ -n "${PROBLEM_IDS}" ]; then
            tasks="${PROBLEM_IDS}"
          else
            python scripts/prepare_task.py --list-tasks > all-tasks.txt
            tasks="$(tr '\n' ' ' < all-tasks.txt)"
          fi

          published=0
          skipped=0
          failed=0
          {
            echo "| task | mode | cases | result |"
            echo "|---|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          cleanup_task() {
            docker image rm -f "${IMAGE_NAME}:$1" "${IMAGE_NAME}:$1-${lock_digest}" > /dev/null 2>&1 || true
            # Untagged verify-stage outputs land in the shared image store as
            # dangling images that pin their layers across iterations.
            docker image prune --force > /dev/null 2>&1 || true
            docker builder prune --all --force > /dev/null 2>&1 || true
            rm -rf build .build
          }

          for task in ${tasks}; do
            if [ "${MAX_TASKS}" != "0" ] && [ "${published}" -ge "${MAX_TASKS}" ]; then
              echo "reached max_tasks=${MAX_TASKS}, stopping"
              break
            fi

            floating="${IMAGE_NAME}:${task}"
            immutable="${IMAGE_NAME}:${task}-${lock_digest}"

            # A task counts as published only when both tags exist and resolve
            # to the same digest. Pushing the two tags is not atomic, so a run
            # that died between them leaves the immutable tag alone in the
            # registry, and skipping on that alone would strand the task.
            if [ "${SKIP_EXISTING}" = "true" ]; then
              immutable_digest="$(docker buildx imagetools inspect "${immutable}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              floating_digest="$(docker buildx imagetools inspect "${floating}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              if [ -n "${immutable_digest}" ] && [ "${immutable_digest}" = "${floating_digest}" ]; then
                echo "skip ${task}, both tags already resolve to ${immutable_digest}"
                skipped=$((skipped + 1))
                echo "| ${task} | | | skipped |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
            fi

            if ! python scripts/prepare_task.py --problem-ids "${task}"; then
              failed=$((failed + 1))
              echo "| ${task} | | | prepare failed |" >> "$GITHUB_STEP_SUMMARY"
              cleanup_task "${task}"
              continue
            fi

            mode="$(python -c "import json,pathlib;print(json.loads(pathlib.Path('build/manifest.json').read_text())['prepared'][0]['interactor_mode'])")"
            cases="$(python -c "import json,pathlib;print(json.loads(pathlib.Path('build/manifest.json').read_text())['prepared'][0]['case_count'])")"

            # Verify before building the publishable image: the final image
            # is pure assets with no shell, so the checks that used to run
            # inside the published image live in the Dockerfile verify stage.
            if ! docker build \
              --file Dockerfile \
              --target verify \
              --build-arg "TASK_ID=${task}" \
              --build-arg "EXPECT_MODE=${mode}" \
              --build-arg "EXPECT_CASES=${cases}" \
              "build/${task}"; then
              failed=$((failed + 1))
              echo "| ${task} | ${mode} | ${cases} | verification failed, not pushed |" >> "$GITHUB_STEP_SUMMARY"
              cleanup_task "${task}"
              continue
            fi

            if ! docker build \
              --file Dockerfile \
              --build-arg "TASK_ID=${task}" \
              --build-arg "LOCK_DIGEST=${lock_digest}" \
              --build-arg "SOURCE_REVISION=${source_revision}" \
              --build-arg "DATASET_REVISION=${dataset_revision}" \
              --tag "${floating}" \
              --tag "${immutable}" \
              "build/${task}"; then
              failed=$((failed + 1))
              echo "| ${task} | ${mode} | ${cases} | build failed |" >> "$GITHUB_STEP_SUMMARY"
              cleanup_task "${task}"
              continue
            fi

            # The assets now live in the image layer; the build context is a
            # second full copy and is dead weight for the rest of the iteration.
            rm -rf build .build

            if ! docker push "${immutable}" || ! docker push "${floating}"; then
              failed=$((failed + 1))
              echo "| ${task} | ${mode} | ${cases} | push failed |" >> "$GITHUB_STEP_SUMMARY"
              cleanup_task "${task}"
              continue
            fi

            digest="$(docker buildx imagetools inspect "${immutable}" --format '{{.Manifest.Digest}}' 2>/dev/null || echo unavailable)"
            published=$((published + 1))
            echo "| ${task} | ${mode} | ${cases} | ${digest} |" >> "$GITHUB_STEP_SUMMARY"

            cleanup_task "${task}"
            df -h / | tail -1
          done

          {
            echo ""
            echo "published ${published}, skipped ${skipped}, failed ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${failed}" -eq 0
